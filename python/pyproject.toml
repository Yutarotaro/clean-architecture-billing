[project]
name = "billing"
version = "0.1.0"
description = "Subscription billing sample, structured with Clean Architecture"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 依存の向きを lint で守る。domain から外側への import はここでは表現できないため
# import-linter 相当の検査は tests/unit/test_layer_dependencies.py で行う。
"datetime.datetime.utcnow".msg = "tz-naive になる。Clock ポート経由で aware な現在時刻を受け取ること"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# boto3 は型スタブを同梱していない。境界（infrastructure/persistence/dynamo）の中だけで
# 型がゆるくなることを許し、そこから外に Any を出さないようにしている。
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true
